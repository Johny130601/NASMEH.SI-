name: nasmeh

services:
  app:
    build: .
    # Explicit image name: scripts/restore.sh starts a second compose project from this
    # image without rebuilding (Phase 9 step 3). IMAGE_TAG (.env) names the release the
    # stack runs: `IMAGE_TAG=<sha> docker compose build` tags a new build, editing
    # IMAGE_TAG in .env and `up -d` switches releases without a rebuild (Phase 9 step 6).
    image: nasmeh-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    env_file: .env
    environment:
      # internal compose network — overrides the localhost URL from .env
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nasmeh
      # PORT in .env is the HOST port (ports: below). env_file would carry it into
      # the container and make the server listen on it instead of 3000, so the
      # health check, the port mapping and the proxy would all miss (Phase 9 step 5
      # rehearsal, staging on PORT=3001). The container always listens on 3000.
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      # Loopback only: the reverse proxy reaches the container over the proxy
      # network (docker-compose.proxy.yml), so nothing on the LAN or the internet
      # talks to the app without TLS. Health checks and the host cron use
      # http://127.0.0.1:${PORT}.
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - uploads:/app/public/uploads
      - review_uploads:/app/review-uploads
      - support_uploads:/app/support-uploads
      - catalog_uploads:/app/catalog-uploads
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # The host's reverse-proxy network is added by docker-compose.proxy.yml
    # (`-f docker-compose.yml -f docker-compose.proxy.yml`), never by editing
    # this file on the server.

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nasmeh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nasmeh"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # Deliberately NOT published to the host (AGENTS §6).
    # Local dev publishes 5543 via docker-compose.override.yml.

  adminer:
    image: adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "18025:8025" # web UI (8025 avoided — commonly taken by other projects)
      - "11025:1025" # SMTP (SMTP_HOST=localhost SMTP_PORT=11025 for local dev)

volumes:
  pgdata:
  uploads:
  review_uploads:
  support_uploads:
  catalog_uploads:

